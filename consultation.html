<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>


<script src="/site.js" defer></script>
<script>
// Page-specific JS: AJAX Formspree submit + Calendly init
(function(){
const BIZ={FORMSPREE:'https://formspree.io/f/xgvnylea',CALENDLY:'https://calendly.com/bizmate-growth/30-minute-consultation',EMAIL:'growth@bizmte.com'};


// Calendly inline
function initCalendly(){ try{ if(window.Calendly && document.getElementById('calendlyInline').children.length===0){Calendly.initInlineWidget({url:BIZ.CALENDLY,parentElement:document.getElementById('calendlyInline')});}}catch(e){console.warn(e);} }
if(window.Calendly) initCalendly(); else window.addEventListener('load', initCalendly);
document.getElementById('openCalendlyPopup')?.addEventListener('click', function(e){e.preventDefault(); if(window.Calendly){Calendly.initPopupWidget({url:BIZ.CALENDLY}); if(window.gtag) gtag('event','open_calendly',{method:'popup'});} else window.open(BIZ.CALENDLY,'_blank');});


// Mark this form as handled to prevent generic fallback
window.BizMateSite = window.BizMateSite || {};
window.BizMateSite.markFormHandled('consultForm');


// AJAX submit
const form=document.getElementById('consultForm');
const msg=document.getElementById('consultMsg');
const btn=document.getElementById('submitBtn');


form.addEventListener('submit', async function(e){
e.preventDefault(); msg.innerHTML='';
const name=form.name.value.trim(); const email=form.email.value.trim();
if(!name||!email){ msg.innerHTML='<div class="error">Please provide your name and email.</div>'; return; }
btn.disabled=true; btn.textContent='Sending…';
// ensure 'to' value
form.querySelector('input[name="to"]').value=BIZ.EMAIL;
const fd=new FormData(form);
try{
const res=await fetch(BIZ.FORMSPREE,{method:'POST',body:fd,headers:{'Accept':'application/json'}});
if(res.ok){ msg.innerHTML='<div class="success">Thanks — message sent. We will contact you shortly to schedule the consultation.</div>'; form.reset(); if(window.gtag) gtag('event','contact_form_submit',{method:'formspree'}); }
else{ const json=await res.json().catch(()=>null); const error=json?.error||'Submission failed — please try again later.'; msg.innerHTML='<div class="error">'+error+'</div>'; }
}catch(err){ console.error(err); msg.innerHTML='<div class="error">Network error — please try again.</div>'; }
finally{ btn.disabled=false; btn.textContent='Request consultation'; }
});
})();
</script>
</body>
</html>
